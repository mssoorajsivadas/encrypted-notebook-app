<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encrypted Notebook</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">

            <div class="topbar-left">

                <h1 class="app-title"> Encrypted Notebook </h1>

            </div>

            <div class="topbar-right">

                <button id="new-note-button" class="new-note-button">
                    <span class="new-note-icon">+</span> <span>New Note</span>
                </button>

                <span id="username" class="username"> Guest </span>

                <button id="signup-button" class="account-button">
                    Sign Up
                </button>

                <button id="login-button" class="account-button">
                    Login
                </button>

                <button id="logout-button" class="account-button">
                    Logout
                </button>

                <button id="change-password-button" class="account-button" hidden>
                    Change Password
                </button>

                <button id="delete-account-button" class="account-button danger-button" hidden>
                    Delete Account
                </button>

            </div>

        </header>




        <section class="notes-area">

            <div class="notes-grid" id="notes-grid">



            </div>

        </section>

        <div id="create-note-modal" class="modal-overlay" hidden>

            <div class="note-modal">

                <div class="modal-header">

                    <h2 id="note-modal-title">Create note</h2>

                    <button id="close-note-modal" class="close-modal-button" title="Close">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>

                </div>


                <div class="modal-body">

                    <div class="form-field">

                        <label for="new-note-title">
                            Title:
                        </label>

                        <input id="new-note-title" type="text" placeholder="My first note">

                    </div>


                    <div class="form-field content-field">

                        <label for="new-note-content">
                            Content:
                        </label>

                        <textarea id="new-note-content" placeholder="Write your note..."></textarea>

                    </div>

                </div>


                <div class="modal-footer">

                    <div class="modal-footer">

                        <button id="note-modal-edit" class="note-modal-edit" hidden>
                            Edit note
                        </button>

                        <button id="note-modal-save" class="create-note-submit">
                            Create note
                        </button>

                    </div>

                </div>

            </div>

        </div>




        <div id="signup-modal" class="modal-overlay" hidden>

            <div class="account-modal">

                <div class="modal-header">

                    <h2>Create account</h2>

                    <button id="close-signup-modal" class="close-modal-button" title="Close">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>

                </div>


                <div class="modal-body">

                    <div class="form-field">

                        <label for="signup-username">
                            Username
                        </label>

                        <input id="signup-username" type="text" placeholder="Enter username" autocomplete="username">

                    </div>


                    <div class="form-field">

                        <label for="signup-password">
                            Password
                        </label>

                        <input id="signup-password" type="password" placeholder="Enter password"
                            autocomplete="new-password">

                    </div>


                    <div class="form-field">

                        <label for="signup-password-confirm">
                            Confirm password
                        </label>

                        <input id="signup-password-confirm" type="password" placeholder="Confirm password"
                            autocomplete="new-password">

                    </div>

                </div>


                <div class="modal-footer">

                    <button id="signup-submit" class="create-note-submit">
                        Create account
                    </button>

                </div>

            </div>

        </div>



        <div id="login-modal" class="modal-overlay" hidden>

            <div class="account-modal">

                <div class="modal-header">

                    <h2>Login</h2>

                    <button id="close-login-modal" class="close-modal-button" title="Close">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>

                </div>


                <div class="modal-body">

                    <div class="form-field">

                        <label for="login-username">
                            Username
                        </label>

                        <input id="login-username" type="text" placeholder="Enter username" autocomplete="username">

                    </div>


                    <div class="form-field">

                        <label for="login-password">
                            Password
                        </label>

                        <input id="login-password" type="password" placeholder="Enter password"
                            autocomplete="current-password">

                    </div>

                </div>


                <div class="modal-footer">

                    <button id="login-submit" class="create-note-submit">
                        Login
                    </button>

                </div>

            </div>

        </div>


        <div id="change-password-modal" class="modal-overlay" hidden>
            <div class="account-modal">

                <div class="modal-header">
                    <h2>Change password</h2>

                    <button id="close-change-password-modal" class="close-modal-button" title="Close">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>
                </div>

                <div class="modal-body">

                    <div class="form-field">
                        <label for="current-password">
                            Current password
                        </label>

                        <input id="current-password" type="password" placeholder="Enter current password"
                            autocomplete="current-password">
                    </div>

                    <div class="form-field">
                        <label for="new-password">
                            New password
                        </label>

                        <input id="new-password" type="password" placeholder="Enter new password"
                            autocomplete="new-password">
                    </div>

                    <div class="form-field">
                        <label for="confirm-new-password">
                            Confirm new password
                        </label>

                        <input id="confirm-new-password" type="password" placeholder="Confirm new password"
                            autocomplete="new-password">
                    </div>

                </div>

                <div class="modal-footer">
                    <button id="change-password-submit" class="create-note-submit">
                        Change password
                    </button>
                </div>

            </div>
        </div>


        <div id="delete-account-modal" class="modal-overlay" hidden>
            <div class="account-modal">

                <div class="modal-header">
                    <h2>Delete account</h2>

                    <button id="close-delete-account-modal" class="close-modal-button" title="Close">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>
                </div>

                <div class="modal-body">

                    <p class="danger-message">
                        This will permanently delete your account
                        and all of your encrypted notes.
                        This action cannot be undone.
                    </p>

                    <div class="form-field">
                        <label for="delete-account-password">
                            Enter your password
                        </label>

                        <input id="delete-account-password" type="password" placeholder="Enter your password"
                            autocomplete="current-password">
                    </div>

                </div>

                <div class="modal-footer">
                    <button id="delete-account-submit" class="delete-account-submit">
                        Delete Account
                    </button>
                </div>

            </div>
        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
